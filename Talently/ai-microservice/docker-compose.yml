version: '3.8'

services:
  sap-evaluator-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sap-evaluator-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./evaluations.csv:/app/evaluations.csv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
